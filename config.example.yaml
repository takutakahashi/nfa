# nfa — network filter for agent
# Example configuration file.
# Pass it with: nfa proxy --config config.yaml
#
# CLI flags and environment variables (NETWORK_FILTER_ALLOWED_DOMAINS,
# NETWORK_FILTER_DENIED_DOMAINS) take precedence over this file.

filter:
  # mode: "allowlist" or "denylist"
  #
  # allowlist — only the listed domains are permitted; everything else is blocked.
  #             An empty `domains` list blocks ALL outbound traffic
  #             (except hardcoded bypass domains such as *.anthropic.com).
  #
  # denylist  — only the listed domains are blocked; everything else is allowed.
  #             An empty `domains` list allows ALL outbound traffic.
  mode: allowlist

  # countMode: when true, rules are evaluated and would-be-blocked domains are
  # recorded in the denied list (GET /domains), but traffic is NOT rejected.
  # Useful for auditing what a policy would block before enforcing it.
  # Can also be set via --count-mode flag or NETWORK_FILTER_COUNT_MODE=true.
  countMode: false

  # domains is the list of patterns to apply in the chosen mode.
  # Patterns support:
  #   *.example.com          — any subdomain of example.com
  #   prefix.*.example.com   — prefix + any single label + suffix
  #   exact.com              — exact hostname match
  domains:
    - "example.com"
    - "*.example.com"
    - "trusted.io"

# controlSocket: optional Unix domain socket path for the control API.
# When set, the control API listens only on this socket and does not bind
# localhost:3129. Can also be set via --control-socket or
# NETWORK_FILTER_CONTROL_SOCKET.
# controlSocket: "/tmp/nfa-control.sock"

# deferredPolicy: when true, the proxy starts in passthrough mode (all traffic
# allowed) and the policy is activated only after:
#   curl -X POST http://localhost:3129/enable-policy
# or, when controlSocket is set:
#   curl --unix-socket /tmp/nfa-control.sock -X POST http://localhost/enable-policy
# Useful when the main container needs network access during startup.
deferredPolicy: false
